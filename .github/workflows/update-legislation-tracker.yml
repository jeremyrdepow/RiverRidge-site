name: Update legislation tracker

on:
  schedule:
    # 10:17 UTC = 6:17 a.m. Ottawa time (EDT), every day.
    - cron: "17 10 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: legislation-tracker
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Fetch bill status from LEGISinfo (openparliament.ca as backup)
        run: node scripts/update-bills.mjs

      - name: Commit updated data
        run: |
          if git diff --quiet -- data/bills.json; then
            echo "No change."; exit 0
          fi
          git config user.name "riverridge-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/bills.json
          git commit -m "Legislation tracker: daily status refresh"
          git push
