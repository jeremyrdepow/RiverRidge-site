name: Update legislation tracker

on:
  schedule:
    # 10:17 UTC = 6:17 a.m. Ottawa time (EDT), every day.
    - cron: "17 10 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: legislation-tracker
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      # pdftotext reads the committee briefs so the models can be given their text.
      - name: Install pdftotext
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils

      - name: Fetch bill status from LEGISinfo (openparliament.ca as backup)
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: node scripts/update-bills.mjs

      - name: Commit updated data
        run: |
          if [ -z "$(git status --porcelain -- data/bills.json data/bills.csv)" ]; then
            echo "No change."; exit 0
          fi
          git config user.name "riverridge-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/bills.json data/bills.csv
          git commit -m "Legislation tracker: daily status refresh"
          # Someone editing a file on GitHub while this runs would otherwise
          # have the push rejected and the day's work thrown away. Rebase on
          # whatever landed meanwhile and try again.
          for attempt in 1 2 3; do
            git push && exit 0
            echo "Push rejected; rebasing on main and retrying ($attempt of 3)."
            git pull --rebase origin main || exit 1
            sleep 5
          done
          echo "Could not push after three attempts."; exit 1
