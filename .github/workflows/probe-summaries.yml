name: Probe bill summaries (temporary)
on:
  push:
    branches: [probe-summaries]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: AI model trial on the C-22 briefs
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          which pdftotext >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils)
          python3 probe/aitrial/trial.py
      - name: Commit results
        if: always()
        run: |
          git config user.name "riverridge-bot"
          git config user.email "actions@users.noreply.github.com"
          git add probe/aitrial
          git commit -m "AI model trial results" && git push
