name: Probe bill summaries (temporary)
on:
  push:
    branches: [probe-summaries]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Fetch samples
        run: |
          UA="RiverRidge-legislation-tracker/1.0 (+https://riverridgeintelligence.ca)"
          out=probe/samples; mkdir -p $out
          while read -r label url; do
            [ -z "$label" ] && continue
            res=$(curl -sS -L -A "$UA" -m 60 -o "$out/$label" -w "%{http_code}\t%{size_download}\t%{content_type}" "$url" 2>&1) || true
            printf "%s\t%s\t%s\n" "$label" "$res" "$url" >> $out/results.tsv
            sleep 1.5
          done <<'URLS'
          notice-paper-p11.html https://www.ourcommons.ca/DocumentViewer/en/45-1/house/sitting-156/order-notice/page-11
          secu-36-notice.html https://www.ourcommons.ca/DocumentViewer/en/45-1/SECU/meeting-36/notice
          secu-36-minutes.html https://www.ourcommons.ca/DocumentViewer/en/45-1/SECU/meeting-36/minutes
          han155.xml https://www.ourcommons.ca/Content/House/451/Debates/155/HAN155-E.XML
          senate-debates-095.html https://sencanada.ca/en/content/sen/chamber/451/debates/095db_2026-10-22-e
          senate-debates-list.html https://sencanada.ca/en/in-the-chamber/debates/45-1
          senate-SECD-witnesses.html https://sencanada.ca/en/committees/SECD/witnesses/45-1
          senate-SECD-schedule.html https://sencanada.ca/en/committees/SECD/meetingschedule/45-1
          URLS
          for n in $(node -e 'console.log(require("./data/bills.config.json").bills.map(b=>b.number.toLowerCase()).join(" "))'); do
            res=$(curl -sS -A "$UA" -m 60 -o "$out/legisinfo-$n.json" -w "%{http_code}\t%{size_download}" "https://www.parl.ca/legisinfo/en/bill/45-1/$n/json" 2>&1) || true
            printf "legisinfo-%s\t%s\n" "$n" "$res" >> $out/results.tsv
            sleep 1.5
          done
      - name: Commit results
        run: |
          git config user.name "riverridge-bot"
          git config user.email "actions@users.noreply.github.com"
          git add probe/samples
          git commit -m "Probe results: samples for committee, debate and notice parsing" && git push
