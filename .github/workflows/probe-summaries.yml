name: Probe bill summaries (temporary)
on:
  push:
    branches: [probe-summaries]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Committee briefs and witness lists
        run: |
          set +e +o pipefail
          UA="RiverRidge-legislation-tracker/1.0 (+https://riverridgeintelligence.ca)"
          out=probe/briefs; mkdir -p $out; log=$out/results.tsv
          get() { curl -sS -L -A "$UA" -m 120 -o "$out/$1" -w "$1\t%{http_code}\t%{size_download}\t%{content_type}\t$2\n" "$2" >> $log 2>&1 || echo "$1	ERR	$2" >> $log; sleep 1.5; }
          get secu-c22-briefs.html "https://www.ourcommons.ca/committees/en/SECU/StudyActivity/GetBriefs?studyActivityId=13454852"
          get secu-c22-witnesses.html "https://www.ourcommons.ca/committees/en/SECU/StudyActivity/Witnesses?studyActivityId=13454852"
          get members.xml "https://www.ourcommons.ca/Members/en/search/XML"
      - name: Commit results
        if: always()
        run: |
          git config user.name "riverridge-bot"
          git config user.email "actions@users.noreply.github.com"
          find probe/briefs -size +3M -delete
          git add probe/briefs
          git commit -m "Probe results: committee briefs and witnesses" && git push
