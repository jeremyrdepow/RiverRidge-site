name: Probe bill summaries (temporary)
on:
  push:
    branches: [probe-summaries]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Fetch samples
        run: |
          UA="RiverRidge-legislation-tracker/1.0 (+https://riverridgeintelligence.ca)"
          out=probe/notices; mkdir -p $out
          for n in 130 131 132 134 135; do
            curl -sS -L -A "$UA" -m 60 -o "$out/toc-$n.html" "https://www.ourcommons.ca/DocumentViewer/en/45-1/house/sitting-$n/order-notice" || true
            page=$(grep -o "/documentviewer/en/45-1/house/sitting-$n/order-notice/page-[0-9]*\">Notice Paper" "$out/toc-$n.html" | head -1 | sed 's/">Notice Paper//')
            echo "sitting $n notice page: $page" >> $out/results.txt
            if [ -n "$page" ]; then curl -sS -L -A "$UA" -m 60 -o "$out/notice-$n.html" "https://www.ourcommons.ca$page" || true; fi
            sleep 1.5
          done
      - name: Commit results
        run: |
          git config user.name "riverridge-bot"
          git config user.email "actions@users.noreply.github.com"
          git add probe/notices
          git commit -m "Probe results: Notice Paper samples" && git push
